appId: com.agentdock.app
productName: AgentDock
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
afterPack: scripts/after-pack-set-icon.js
asarUnpack:
  - '**/*.node'
  - 'node_modules/node-pty/build/Release/**'
  - 'node_modules/node-pty/prebuilds/**'
  # @openai/codex-sdk resolves its own bundled native Codex runtime from a
  # per-platform optional dependency (e.g. @openai/codex-win32-x64 on
  # Windows — see codex-runtime-resolver.ts's module comment) whose
  # `vendor/<target-triple>/bin/` directory ships real native executables
  # (codex.exe, codex-code-mode-host.exe, rg.exe, ...) that must be spawned
  # directly. A file trapped inside app.asar can never be launched that way
  # (Windows/macOS/Linux process-creation APIs all require a real file on
  # disk) — this unpacks it into the sibling app.asar.unpacked directory
  # instead. The `**/` prefix matches regardless of exactly how deep
  # electron-builder's own dependency walker nests the optional package
  # (confirmed empirically: it can land either hoisted at
  # node_modules/@openai/codex-win32-x64 or nested under
  # node_modules/@openai/codex/node_modules/@openai/codex-win32-x64,
  # depending on the install) — never a hardcoded developer-machine path.
  # Covers every platform @openai/codex declares an optional native package
  # for (win32/darwin/linux, x64/arm64) so a future mac/linux packaged build
  # gets the same fix without needing this file touched again.
  - '**/@openai/codex-*-*/**'
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  # Avoids electron-builder fetching winCodeSign (needed only for exe
  # resource/signature editing) — on this machine extracting that archive
  # fails because non-elevated Windows accounts lack the privilege to
  # create the symlinks it contains. We don't code-sign, so this is safe.
  # Unsigned builds show a Windows SmartScreen warning on first run —
  # expected and documented, not a bug; code signing is out of scope for
  # this pass.
  signAndEditExecutable: false
nsis:
  # Per-user install (no admin elevation required) with a real wizard
  # (not a silent one-click install) so the user can see/choose the
  # install directory and shortcuts, and gets proper Start Menu +
  # uninstaller entries — electron-builder's NSIS target provides both
  # automatically for a non-oneClick build.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AgentDock
mac:
  target:
    - target: dmg
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Unsigned build (no Apple Developer certificate/notarization in this
  # pass, per project scope) — Gatekeeper will show an "unidentified
  # developer" warning on first launch. Users must right-click > Open (or
  # System Settings > Privacy & Security > "Open Anyway") once to run it.
  # hardenedRuntime/notarize intentionally left unset until code signing
  # is in scope.
  identity: null
linux:
  target: AppImage
  icon: build/icon.png
  category: Development
npmRebuild: false
